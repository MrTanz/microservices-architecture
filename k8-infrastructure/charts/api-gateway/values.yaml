replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  scaleDown:
    stabilizationWindowSeconds: 60
    maxPodRemovalPercent: 50
    periodSeconds: 15

image:
  repository: api-gateway
  tag: latest
  pullPolicy: IfNotPresent

container:
  port: 8080

ingress:
  host: api.localhost

service:
  enabled: true
  type: ClusterIP
  port: 80

config:
  AUTH_SERVICE_URL: ""
  USER_SERVICE_URL: ""

secrets: 
  JWT_SECRET_KEY: ""