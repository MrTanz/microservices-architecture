{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-gateway.fullName" $ }}-svc
spec:
  type: {{ .type }}
  selector:
    {{- include "api-gateway.selectorLabels" $ | nindent 4 }}
  ports:
    - port: {{ .port }}
      targetPort: {{ $.Values.container.port }}
{{- end }}
