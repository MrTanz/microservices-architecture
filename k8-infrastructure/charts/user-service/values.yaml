replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  scaleDown:
    stabilizationWindowSeconds: 60
    maxPodRemovalPercent: 50
    periodSeconds: 15

image:
  repository: user-service
  tag: latest
  pullPolicy: IfNotPresent

container:
  port: "8080"

service:
  enabled: true
  type: ClusterIP
  port: "8080"

config:
  SERVER_PORT: "8080"
  REGION: ""
  QUEUE_URL: ""

secrets:
  DATABASE_URL: ""
  DATABASE_PORT: ""
  DATABASE_NAME: ""
  DATABASE_SCHEMA: ""
  DATABASE_USERNAME: ""
  DATABASE_PASSWORD: ""
  JWT_SECRET_KEY: ""
  INTERNAL_API_KEY: ""