apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth-service.fullName" . }}-config
data:
  SERVER_PORT: {{ .Values.global.config.SERVER_PORT | default .Values.config.SERVER_PORT | quote }}
  DATABASE_URL: {{ .Values.global.config.DATABASE_URL | default .Values.config.DATABASE_URL | quote }}
  DATABASE_PORT: {{ .Values.global.config.DATABASE_PORT | default .Values.config.DATABASE_PORT | quote }}
  DATABASE_NAME: {{ .Values.global.config.DATABASE_NAME | default .Values.config.DATABASE_NAME | quote }}
  DATABASE_SCHEMA: {{ .Values.config.DATABASE_SCHEMA | quote }}
  DATABASE_USERNAME: {{ .Values.global.config.DATABASE_USERNAME | default .Values.config.DATABASE_USERNAME | quote }}
  DATABASE_PASSWORD: {{ .Values.global.config.DATABASE_PASSWORD | default .Values.config.DATABASE_PASSWORD | quote }}
  JWT_SECRET_KEY: {{ .Values.global.config.JWT_SECRET_KEY | default .Values.config.JWT_SECRET_KEY | quote }}
  JWT_TOKEN_VALIDITY: {{ .Values.global.config.JWT_TOKEN_VALIDITY | default .Values.config.JWT_TOKEN_VALIDITY | quote }}
  INTERNAL_API_KEY: {{ .Values.global.config.INTERNAL_API_KEY | default .Values.config.INTERNAL_API_KEY | quote }}
  USER_SERVICE_URL: {{ .Values.global.config.USER_SERVICE_URL | default .Values.config.USER_SERVICE_URL | quote }}