spring.application.name=auth
server.port=8081

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}?currentSchema=${DATABASE_SCHEMA}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA configurations
spring.jpa.hibernate.ddl-auto=update

# Security
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.token-validity=${JWT_TOKEN_VALIDITY}
security.internal-api-key=${INTERNAL_API_KEY}

# ECS DNS
user-service-url=${USER_SERVICE_URL}